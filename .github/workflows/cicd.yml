name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.18.0

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Verify Cypress binary
      - name: Verify Cypress installation
        run: npx cypress verify

      # Step 5: Run Cypress tests in headless mode
      - name: Run Cypress tests
        run: npx cypress run --headless --browser chrome
        env:
          CYPRESS_BASE_URL: https://practicesoftwaretesting.com

      # Step 6: Archive test results and screenshots
      - name: Archive test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-results
          path: cypress/screenshots/

      # Step 7: Notify on failure (optional)
      - name: Notify failure
        if: failure()
        run: echo "Tests failed. Please check the logs and screenshots."